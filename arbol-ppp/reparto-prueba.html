<style>
  /* SPPP · T-10 · página de prueba del módulo de repartos (corrección 1, dictamen T-11): el Árbol a la izquierda, el estado del reparto a la derecha */
  body { margin: 0; font-family: 'Instrument Sans', system-ui, sans-serif; color: #231d14; background: #fbf8f2; }
  .rp-aviso { margin: 0; padding: 8px 14px; font-size: 13px; background: #f3e6c8; border-bottom: 1px solid #e1d3ae; }
  .rp-marco { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0; height: calc(100vh - 36px); }
  #arbol-ppp { min-width: 0; height: 100%; overflow: hidden; }
  #reparto-estado { overflow: auto; border-left: 1px solid #e1dacb; padding: 12px 14px; font-size: 13px; background: #fffdf9; }
  .rp-estado h2 { font-size: 16px; margin: 0 0 6px; } .rp-estado h3 { font-size: 13px; margin: 12px 0 4px; }
  .rp-estado[data-estado^="AUTORIZABLE"] h2 { color: #2b5b39; } .rp-estado[data-estado^="NO AUTORIZABLE"] h2, .rp-estado[data-estado^="INVÁLIDO"] h2, .rp-estado[data-estado^="BLOQUEADO"] h2 { color: #7f2f26; }
  .rp-tabla { width: 100%; border-collapse: collapse; } .rp-tabla th, .rp-tabla td { text-align: left; vertical-align: top; padding: 3px 4px; border-bottom: 1px solid #eee6d6; font-weight: 400; }
  .rp-tabla th { color: #6e675a; width: 46%; } .rp-motivos li { margin-bottom: 4px; } .rp-alcance { color: #6e675a; margin: 0 0 8px; }
  @media (max-width: 900px) { .rp-marco { grid-template-columns: 1fr; height: auto; } #arbol-ppp { height: 70vh; } #reparto-estado { border-left: 0; border-top: 1px solid #e1dacb; } }
</style>
</head>
