<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<!-- SPPP · T-10 v3 (dictamen T-11 v2, punto 1): página de prueba sin red. Sólo carga archivos de esta copia; la política de abajo impide en el
     navegador cualquier otra petición (scripts, estilos, fuentes, imágenes o conexiones a otro origen). Sin la puerta del portal, sólo arranca en local. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Árbol PPP · reparto en copia de prueba · YoDesarrollo</title>
<link rel="stylesheet" href="pantalla.css?v=20261125-arbol-tarjetas">
<style>
  /* SPPP · T-10 · página de prueba del módulo de repartos (corrección 1, dictamen T-11): el Árbol a la izquierda, el estado del reparto a la derecha */
  body { margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: #231d14; background: #fbf8f2; }
  .rp-aviso { margin: 0; padding: 8px 14px; font-size: 13px; background: #f3e6c8; border-bottom: 1px solid #e1d3ae; }
  .rp-marco { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0; height: calc(100vh - 36px); }
  #arbol-ppp { min-width: 0; height: 100%; overflow: hidden; }
  #reparto-estado { overflow: auto; border-left: 1px solid #e1dacb; padding: 12px 14px; font-size: 13px; background: #fffdf9; }
  .rp-estado h2 { font-size: 16px; margin: 0 0 6px; } .rp-estado h3 { font-size: 13px; margin: 12px 0 4px; }
  .rp-estado[data-estado^="AUTORIZABLE"] h2 { color: #2b5b39; } .rp-estado[data-estado^="NO AUTORIZABLE"] h2, .rp-estado[data-estado^="INVÁLIDO"] h2, .rp-estado[data-estado^="BLOQUEADO"] h2 { color: #7f2f26; }
  .rp-tabla { width: 100%; border-collapse: collapse; } .rp-tabla th, .rp-tabla td { text-align: left; vertical-align: top; padding: 3px 4px; border-bottom: 1px solid #eee6d6; font-weight: 400; }
  .rp-tabla th { color: #6e675a; width: 46%; } .rp-motivos li { margin-bottom: 4px; } .rp-alcance { color: #6e675a; margin: 0 0 8px; }
  @media (max-width: 900px) { .rp-marco { grid-template-columns: 1fr; height: auto; } #arbol-ppp { height: 70vh; } #reparto-estado { border-left: 0; border-top: 1px solid #e1dacb; } }
</style>
</head>
<body>
<p class="rp-aviso" role="note">Copia de prueba del módulo de repartos (SPPP · T-10): sólo vertical en venta; renta y el Hub quedan bloqueados. Esta página no guarda en el libro ni toca el PPP Maestro, no pide nada a internet y guarda sus planes aparte de los del Árbol habitual.</p>
<div class="rp-marco">
  <div id="arbol-ppp"></div>
  <aside id="reparto-estado" aria-live="polite" aria-label="Estado del reparto del plan en pantalla"></aside>
</div>
<script src="reparto.js?v=20261125-arbol-tarjetas"></script>
<script src="motor.js?v=20261125-arbol-tarjetas"></script>
<script src="definicion-tablas.js?v=20261125-arbol-tarjetas"></script>
<script src="definicion-reparto.js?v=20261125-arbol-tarjetas"></script>
<script src="pantalla.js?v=20261125-arbol-tarjetas"></script>
<script src="reparto-prueba.js?v=20261125-arbol-tarjetas"></script>
</body>
</html>
