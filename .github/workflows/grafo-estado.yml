name: Grafo · estado
# Revisa flujos, chinches, cambios y páginas de los repositorios del grafo (lee GitHub y las páginas), deja el resultado
# en la rama de datos `grafo-datos` y abre chinches; nunca escribe en la principal (está protegida) ni toca ningún /exec.
# Cuándo corre:
#  · por horario: pide dos por hora, pero GitHub arranca los horarios cuando puede (con carga alta los retrasa y
#    descarta algunos). Medido del 8 al 12-nov-2026 en esta organización: cada línea de horario corre unas tres veces
#    al día y con horas de retraso, sin importar cada cuánto pida. No es «cada hora». Por eso no depende sólo del reloj:
#  · en cuanto se aprueba un grafo (cambia grafo/versiones.json en la principal);
#  · en cuanto termina en la principal una revisión de este repositorio: si falló, se pinta y se abre su chinche
#    en ese momento; si volvió a pasar, se quita;
#  · cuando aquí se abre, se cierra o se reabre una chinche.
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  push:
    branches: [main]
    paths:
      - 'grafo/versiones.json'
  workflow_run:
    workflows: ['Arquitectura YOD', 'Verificar acceso PPP', 'Verificar interfaz PPP']
    types: [completed]
    branches: [main]
  issues:
    types: [opened, closed, reopened]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  estado:
    name: Revisar errores y cambios (sólo lectura)
    # Una revisión a la vez; si llegan varias seguidas, espera sólo la más nueva. Va en el trabajo y no en el flujo para
    # que un aviso que se salta (un issue que no es chinche) no le quite el turno a una revisión que estaba esperando.
    concurrency:
      group: grafo-datos
      cancel-in-progress: false
    # Sólo desde la principal. De los avisos de issues, sólo las chinches; las que abre el propio grafo no avisan,
    # porque GitHub no dispara flujos con lo que hace el robot del repositorio.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'issues' ||
       startsWith(github.event.issue.title, '📌') ||
       contains(join(github.event.issue.labels.*.name, ','), 'chinche'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Traer la rama de datos
        run: bash scripts/grafo-rama-datos.sh traer
      - name: Leer flujos, chinches, cambios y páginas
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/grafo-estado.cjs --chinches --salida "$RUNNER_TEMP/grafo-datos"
      - name: Guardar estado y registro
        run: |
          bash scripts/grafo-rama-datos.sh guardar 'Grafo: estado del sistema'
