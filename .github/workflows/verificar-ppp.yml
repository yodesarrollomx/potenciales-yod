name: Verificar interfaz PPP
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  interfaz:
    name: PPP · interfaz y contratos
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.55.1-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: yodesarrollomx/yod-portal
          ref: ffdf31ae3b95855145e2ed7118c53edddfa1ded7
          path: .yod-atlas-ui
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controles, cálculo original y sintaxis
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node --check ppp-agent-cards.js
          node --test tests/ppp-agent-cards.test.cjs
          node --check ppp-agent-bridge.js
          node --test tests/ppp-agent-bridge.test.cjs tests/ppp-agent-receipts.test.cjs
          node --check ppp-ui.js
          node --check ppp-version-bridge.js
          node --check ppp-patrimonial-native.js
          node --check ppp-case-loader.js
          node --check ppp-case-opening.js
          node --test tests/ppp-case-opening.test.cjs
          node --check ppp-projects.js
          node --test tests/ppp-projects.test.cjs
          node --check ppp-catalog.js
          node --test tests/ppp-catalog.test.cjs
          node --check ppp-macro-cards.js
          node --test tests/ppp-ui.test.cjs tests/ppp-case-loader.test.cjs tests/sheets-offline.cjs tests/access-gates.cjs tests/patrimonial-native.test.cjs tests/ppp-version-bridge.test.cjs
          git diff --check
      - name: Instalar navegadores
        run: |
          npm install --prefix "$RUNNER_TEMP/ppp-browser" --no-audit --no-fund playwright@1.55.1
      - name: Leaflet real para pruebas aisladas de la portada
        run: |
          mkdir -p "$RUNNER_TEMP/ppp-map-assets"
          curl --fail --location --retry 3 https://unpkg.com/leaflet@1.9.4/dist/leaflet.js -o "$RUNNER_TEMP/ppp-map-assets/leaflet.js"
          curl --fail --location --retry 3 https://unpkg.com/leaflet@1.9.4/dist/leaflet.css -o "$RUNNER_TEMP/ppp-map-assets/leaflet.css"
          curl --fail --location --retry 3 https://unpkg.com/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.js -o "$RUNNER_TEMP/ppp-map-assets/gesture.js"
          curl --fail --location --retry 3 https://unpkg.com/leaflet-gesture-handling@1.2.2/dist/leaflet-gesture-handling.min.css -o "$RUNNER_TEMP/ppp-map-assets/gesture.css"
      - name: Recorridos reales del DOM con transporte sintético
        env:
          NODE_PATH: ${{ runner.temp }}/ppp-browser/node_modules
          YOD_ATLAS_DIR: ${{ github.workspace }}/.yod-atlas-ui
          PPP_SCREENSHOTS: ${{ runner.temp }}/ppp-shots
          PPP_MAP_ASSETS: ${{ runner.temp }}/ppp-map-assets
        run: |
          node tests/ppp-version-bridge-browser.cjs
          node tests/ppp-restored-bridge-browser.cjs
          node tests/ppp-agent-cards-browser.cjs
          node tests/ppp-case-opening-browser.cjs
          node tests/ppp-case-opening-shell-browser.cjs
          node tests/ppp-agent-receipts-browser.cjs
          node tests/ppp-browser.cjs
          node tests/ppp-identity-browser.cjs
          node tests/ppp-terrain-browser.cjs
          node tests/ppp-versions-browser.cjs
          node tests/ppp-cierre-browser.cjs
          node tests/ppp-macro-cards-browser.cjs
          node tests/ppp-home-browser.cjs
          node tests/patrimonial-native-browser.cjs
          node tests/patrimonial-drafts-browser.cjs
      - name: Comprobar archivos publicados
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PUBLICATION_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const digest=b=>crypto.createHash('sha256').update(b).digest('hex');
          (async()=>{
            const paths=['index.html','ppp-projects.js','ppp-home.css','ppp-catalog.js','ppp-catalog.css','mapa.html','ppp-version-bridge.js','mixto.html','macrolotes.html','patrimonial.html','ppp-case-opening.js','portero.js'];
            for(const path of paths){
              const expected=digest(fs.readFileSync(path));let verified=false;
              for(let attempt=0;attempt<6;attempt++){
                const response=await fetch('https://yodesarrollomx.github.io/potenciales-yod/'+path+'?deploy='+process.env.PUBLICATION_SHA,{signal:AbortSignal.timeout(10000)});
                if(response.ok&&digest(Buffer.from(await response.arrayBuffer()))===expected){verified=true;break;}
                if(attempt<5)await new Promise(resolve=>setTimeout(resolve,5000));
              }
              if(!verified)throw Error('Publication mismatch: '+path);
              console.log('Published bytes verified: '+path);
            }
          })().catch(error=>{console.error(error.message);process.exitCode=1;});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ppp-interfaz-sintetica
          path: ${{ runner.temp }}/ppp-shots
          if-no-files-found: ignore
